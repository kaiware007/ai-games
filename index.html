<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Games Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #1a1a2e; color: #FFF; padding: 20px; }
  h1 { text-align: center; margin-bottom: 30px; color: #FFD700; }
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 900px; margin: 0 auto; }
  .game-card { background: #16213e; border-radius: 12px; overflow: hidden; text-decoration: none; color: #FFF; transition: transform 0.2s; }
  .game-card:hover { transform: scale(1.03); }
  .game-card .thumb { height: 150px; background: #0f3460; display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .game-card .info { padding: 15px; }
  .game-card .info h3 { margin-bottom: 8px; color: #FFD700; }
  .game-card .info p { font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<h1>🎮 AI Games Portal</h1>
<div class="game-grid">
  <a class="game-card" href="fantasy_td/index.html">
    <div class="thumb">🏰</div>
    <div class="info">
      <h3>Fantasy Tower Defense</h3>
      <p>タワーを配置して敵を防ごう！4種類のタワーで10ウェーブをクリア。</p>
    </div>
  </a>
</div>
</body>
</html>
