<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fantasy Tower Defense</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script type="module">
import { Game } from './js/game.js';

const canvas = document.getElementById('gameCanvas');
const w = Math.min(window.innerWidth, 800);
const h = Math.min(window.innerHeight, 600);
canvas.width = w;
canvas.height = h;

const game = new Game(canvas);
game.init();
game.start();
</script>
</body>
</html>
